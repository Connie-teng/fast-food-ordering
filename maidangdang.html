<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>賣噹噹 M·Dong·Dong Fast Food</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red:    #E8001D;
    --yellow: #FFC300;
    --cream:  #FFF8EC;
    --dark:   #1A0A00;
    --brown:  #3D1C00;
    --orange: #FF6B00;
    --green:  #00A86B;
    --gray:   #F5F0E8;
    --shadow: 0 4px 24px rgba(26,10,0,0.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── BACKGROUND PATTERN ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,195,0,0.12) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(232,0,29,0.08) 0%, transparent 40%),
      repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(255,195,0,0.04) 40px, rgba(255,195,0,0.04) 41px);
  }

  /* ── HEADER ── */
  header {
    background: var(--red);
    color: #fff;
    text-align: center;
    padding: 20px 16px 16px;
    position: relative;
    overflow: hidden;
    border-bottom: 6px solid var(--yellow);
  }
  header::after {
    content: '🍔🍟🥤🍦🐔';
    position: absolute; bottom: -8px; left: 0; right: 0;
    font-size: 22px; letter-spacing: 14px;
    opacity: 0.15; white-space: nowrap; overflow: hidden;
  }
  .logo-en {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px; letter-spacing: 5px;
    color: rgba(255,255,255,0.7);
    margin-bottom: 4px;
  }
  .logo-zh {
    font-size: 42px; font-weight: 900; line-height: 1;
    text-shadow: 4px 4px 0 rgba(0,0,0,0.25);
    letter-spacing: 4px;
  }
  .logo-zh span { color: var(--yellow); }
  .header-sub {
    font-size: 12px; color: rgba(255,255,255,0.75);
    margin-top: 6px; letter-spacing: 2px;
  }

  /* ── DAILY SPECIAL BANNER ── */
  .daily-banner {
    background: var(--yellow);
    color: var(--dark);
    text-align: center;
    padding: 10px 16px;
    font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    animation: pulse-banner 2.5s ease-in-out infinite;
  }
  @keyframes pulse-banner {
    0%,100% { background: var(--yellow); }
    50%      { background: #FFD740; }
  }
  .daily-banner .old-price { text-decoration: line-through; opacity: 0.55; font-weight: 400; }
  .daily-banner .new-price { color: var(--red); font-size: 18px; }

  /* ── MAIN LAYOUT ── */
  .app { max-width: 960px; margin: 0 auto; padding: 20px 12px 80px; }

  /* ── MEMBER BAR ── */
  .member-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--dark); color: #fff;
    padding: 10px 16px; border-radius: 12px;
    margin-bottom: 20px; font-size: 14px;
    box-shadow: var(--shadow);
  }
  .member-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--yellow); color: var(--dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; flex-shrink: 0;
  }
  .member-info { flex: 1; }
  .member-name { font-weight: 700; font-size: 15px; }
  .member-pts  { font-size: 11px; color: rgba(255,255,255,0.6); }
  .btn-member {
    background: var(--yellow); color: var(--dark);
    border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: transform .15s, background .15s;
  }
  .btn-member:hover { transform: scale(1.05); background: #FFD740; }

  /* ── SECTION TABS ── */
  .tabs {
    display: flex; gap: 6px; margin-bottom: 20px;
    background: var(--brown); padding: 6px; border-radius: 14px;
  }
  .tab {
    flex: 1; padding: 10px 6px; border: none; border-radius: 10px;
    background: transparent; color: rgba(255,255,255,0.6);
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700; font-size: 13px; cursor: pointer;
    transition: all .2s; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tab .tab-icon { font-size: 20px; }
  .tab.active { background: var(--yellow); color: var(--dark); }
  .tab:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.1); }

  /* ── PANELS ── */
  .panel { display: none; animation: fadeUp .3s ease; }
  .panel.active { display: block; }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(12px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* ── SECTION TITLE ── */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 3px;
    color: var(--red); margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 3px;
    background: linear-gradient(90deg, var(--red), transparent);
    border-radius: 2px;
  }

  /* ── MEAL CARDS ── */
  .meal-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .meal-card {
    background: #fff; border-radius: 20px;
    border: 2.5px solid transparent;
    overflow: hidden; cursor: pointer;
    transition: all .25s; position: relative;
    box-shadow: 0 2px 12px rgba(26,10,0,0.08);
  }
  .meal-card:hover { transform: translateY(-6px); border-color: var(--yellow); box-shadow: 0 12px 32px rgba(26,10,0,0.16); }
  .meal-card.selected { border-color: var(--red); }

  .meal-img-wrap {
    position: relative; width: 100%; height: 150px; overflow: hidden;
    background: #FFF3E0;
    display: flex; align-items: center; justify-content: center;
  }
  .meal-img-wrap svg {
    width: 100%; height: 100%;
    transition: transform .35s ease;
    display: block;
  }
  .meal-card:hover .meal-img-wrap svg { transform: scale(1.06); }
  .meal-img-badge {
    position: absolute; top: 10px; left: 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px; line-height: 1;
    background: var(--red); color: #fff;
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .meal-img-price {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(26,10,0,0.75); color: var(--yellow);
    font-weight: 900; font-size: 16px;
    padding: 4px 10px; border-radius: 20px;
    backdrop-filter: blur(4px);
  }

  /* card body */
  .meal-body { padding: 14px 14px 14px; }
  .meal-name { font-weight: 900; font-size: 15px; margin-bottom: 4px; }
  .meal-items { font-size: 12px; color: #888; line-height: 1.7; margin-bottom: 10px; }
  .meal-price {
    font-weight: 900; font-size: 20px; color: var(--dark);
  }
  .meal-price span { font-size: 12px; font-weight: 400; }
  .meal-qty-row {
    display: flex; align-items: center; gap: 6px; margin-top: 10px;
  }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--red); background: #fff;
    color: var(--red); font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .qty-btn:hover { background: var(--red); color: #fff; }
  .qty-num { font-weight: 700; min-width: 22px; text-align: center; font-size: 15px; }

  /* ── PRODUCT LIST ── */
  .product-list { display: flex; flex-direction: column; gap: 10px; }
  .product-row {
    background: #fff; border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 10px rgba(26,10,0,0.07);
    transition: transform .15s;
  }
  .product-row:hover { transform: translateX(4px); }
  .product-num {
    font-family: 'Space Mono', monospace;
    font-size: 13px; color: rgba(0,0,0,0.3); min-width: 22px;
  }
  .product-emoji { font-size: 26px; }
  .product-name { flex: 1; font-weight: 700; font-size: 15px; }
  .product-special-tag {
    font-size: 10px; font-weight: 700; background: var(--red);
    color: #fff; padding: 2px 6px; border-radius: 6px; margin-left: 6px;
  }
  .product-price { font-weight: 900; font-size: 16px; color: var(--dark); }
  .product-old   { text-decoration: line-through; color: #aaa; font-size: 13px; margin-right: 4px; }

  /* ── CART ── */
  .cart-empty {
    text-align: center; padding: 60px 20px;
    font-size: 15px; color: #aaa;
  }
  .cart-empty .big-emoji { font-size: 64px; display: block; margin-bottom: 12px; }

  .cart-item {
    background: #fff; border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 10px;
    box-shadow: 0 2px 10px rgba(26,10,0,0.07);
  }
  .cart-item-name { flex: 1; font-weight: 700; }
  .cart-item-qty  { color: #888; font-size: 13px; }
  .cart-item-price { font-weight: 900; color: var(--red); }
  .cart-remove {
    width: 28px; height: 28px; border-radius: 50%;
    border: none; background: #FFF0F0; color: var(--red);
    font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .cart-remove:hover { background: var(--red); color: #fff; }

  .cart-summary {
    background: var(--dark); color: #fff; border-radius: 16px;
    padding: 20px; margin-top: 20px;
  }
  .cart-summary .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
  .cart-summary .total { font-size: 24px; font-weight: 900; color: var(--yellow); }
  .cart-summary .discount-note { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 4px; }

  /* ── CHECKOUT ── */
  .checkout-section { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: 0 2px 12px rgba(26,10,0,0.07); }
  .checkout-section h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .pay-options { display: flex; gap: 10px; flex-wrap: wrap; }
  .pay-opt {
    flex: 1; min-width: 100px; padding: 14px; border-radius: 12px;
    border: 2.5px solid #eee; background: #fafafa; cursor: pointer;
    text-align: center; font-size: 13px; font-weight: 700;
    transition: all .18s;
  }
  .pay-opt .pay-icon { font-size: 28px; display: block; margin-bottom: 6px; }
  .pay-opt:hover, .pay-opt.selected { border-color: var(--red); background: #fff5f5; }

  /* ── BUTTONS ── */
  .btn-primary {
    display: block; width: 100%; padding: 16px;
    background: var(--red); color: #fff;
    border: none; border-radius: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 17px; font-weight: 900; cursor: pointer;
    transition: all .2s;
    box-shadow: 0 4px 16px rgba(232,0,29,0.35);
    letter-spacing: 1px;
  }
  .btn-primary:hover { background: #c5001a; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,0,29,0.4); }
  .btn-primary:disabled { background: #ccc; box-shadow: none; transform: none; cursor: not-allowed; }

  .btn-secondary {
    display: inline-block; padding: 10px 20px;
    background: var(--gray); color: var(--dark);
    border: none; border-radius: 10px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all .15s;
  }
  .btn-secondary:hover { background: #e8e3db; }

  /* ── BOTTOM CART BAR ── */
  .cart-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--dark); color: #fff;
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    z-index: 100;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
  }
  .cart-bar-icon { font-size: 26px; position: relative; cursor: pointer; }
  .cart-badge {
    position: absolute; top: -6px; right: -8px;
    background: var(--red); color: #fff;
    font-size: 10px; font-weight: 900;
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .cart-bar-total { flex: 1; font-size: 20px; font-weight: 900; color: var(--yellow); }
  .cart-bar-sub   { font-size: 12px; color: rgba(255,255,255,0.5); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: #fff; border-radius: 24px; padding: 28px 24px;
    width: min(440px, 94vw); max-height: 90vh; overflow-y: auto;
    transform: translateY(20px); transition: transform .25s;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h2 { font-size: 22px; font-weight: 900; margin-bottom: 18px; }
  .modal-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; font-size: 22px; cursor: pointer;
    color: #aaa;
  }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #666; }
  .form-input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 2px solid #e8e8e8; font-size: 15px;
    font-family: 'Noto Sans TC', sans-serif;
    transition: border-color .15s;
  }
  .form-input:focus { outline: none; border-color: var(--red); }

  /* ── RECEIPT ── */
  .receipt {
    background: #fff; border-radius: 20px; padding: 28px 22px;
    max-width: 380px; margin: 0 auto;
    border: 3px dashed #ddd;
    font-family: 'Space Mono', monospace;
  }
  .receipt-header { text-align: center; margin-bottom: 20px; }
  .receipt-logo { font-size: 36px; font-weight: 900; color: var(--red); letter-spacing: 2px; }
  .receipt-date { font-size: 11px; color: #999; }
  .receipt-divider { border: none; border-top: 2px dashed #ddd; margin: 16px 0; }
  .receipt-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .receipt-total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-top: 8px; }
  .receipt-thanks { text-align: center; margin-top: 20px; font-size: 12px; color: #aaa; }

  /* ── TOAST ── */
  .toast-container { position: fixed; top: 16px; right: 16px; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--dark); color: #fff; padding: 12px 18px; border-radius: 12px;
    font-size: 14px; font-weight: 600; max-width: 280px;
    animation: toastIn .3s ease;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  @keyframes toastIn {
    from { opacity:0; transform: translateX(20px); }
    to   { opacity:1; transform: translateX(0); }
  }
  .toast.success { border-left: 4px solid var(--green); }
  .toast.info    { border-left: 4px solid var(--yellow); }
  .toast.error   { border-left: 4px solid var(--red); }

  /* ── DISCOUNT BADGE ── */
  .discount-chip {
    display: inline-block; background: var(--red); color: #fff;
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
    margin-left: 6px;
  }

  /* ── LUCKY WHEEL ANIMATION ── */
  .wheel-anim {
    text-align: center; padding: 30px;
    font-size: 60px;
    animation: spin-emoji .6s ease-in-out infinite alternate;
  }
  @keyframes spin-emoji {
    from { transform: rotate(-15deg) scale(1); }
    to   { transform: rotate(15deg) scale(1.15); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 480px) {
    .meal-grid { grid-template-columns: 1fr 1fr; }
    .logo-zh { font-size: 34px; }
  }

  /* ── MEMBER POINTS PILL ── */
  .pts-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--yellow); color: var(--dark);
    border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 700;
  }
  /* ── AI OPT BUTTONS ── */
  .ai-opt-btn {
    padding: 8px 16px; border-radius: 20px; border: 2px solid #e0e0e0;
    background: #fafafa; font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px; font-weight: 700; cursor: pointer; color: #666;
    transition: all .15s;
  }
  .ai-opt-btn.active { border-color: var(--red); background: #fff0f0; color: var(--red); }
  .ai-opt-btn:hover:not(.active) { border-color: #ccc; background: #f0f0f0; }

  /* ── AI RESULT CARD ── */
  .ai-result-card {
    background: linear-gradient(135deg, #fffbf0, #fff8e1);
    border: 2px solid var(--yellow); border-radius: 16px; padding: 16px;
    margin-bottom: 10px;
  }
  .ai-result-card .tag {
    display: inline-block; font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 20px; margin-bottom: 8px;
  }
  .ai-result-card .tag.best { background: var(--red); color: #fff; }
  .ai-result-card .tag.alt  { background: var(--yellow); color: var(--dark); }
  .ai-result-title { font-weight: 900; font-size: 15px; margin-bottom: 6px; }
  .ai-result-items { font-size: 13px; color: #666; line-height: 1.8; }
  .ai-result-meta  { display: flex; gap: 12px; margin-top: 10px; font-size: 12px; font-weight: 700; }
  .ai-result-meta span { display: flex; align-items: center; gap: 4px; }
  .ai-add-btn {
    margin-top: 10px; width: 100%; padding: 10px; border-radius: 10px;
    border: none; background: var(--dark); color: #fff;
    font-family: 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: background .15s;
  }
  .ai-add-btn:hover { background: var(--red); }

  /* ── CALORIE BADGE on meal card ── */
  .cal-badge {
    position: absolute; top: 10px; right: 10px;
    background: rgba(255,255,255,0.9); color: #E65100;
    font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 20px;
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo-en">M · D O N G · D O N G  F A S T  F O O D</div>
  <div class="logo-zh">賣<span>噹</span>噹</div>
  <div class="header-sub">歡迎光臨 ✦ 美味快速 ✦ 超值享受</div>
</header>

<!-- ── DAILY SPECIAL ── -->
<div class="daily-banner" id="dailyBanner">
  🌟 今日特餐：<strong id="dailyName"></strong>
  <span class="old-price" id="dailyOld"></span>
  <span class="new-price" id="dailyNew"></span>
  立即選購！
</div>

<!-- ── MAIN APP ── -->
<div class="app">

  <!-- MEMBER BAR -->
  <div class="member-bar">
    <div class="member-avatar" id="memberAvatar">👤</div>
    <div class="member-info">
      <div class="member-name" id="memberName">訪客</div>
      <div class="member-pts" id="memberPts">登入享九五折 + 積分回饋</div>
    </div>
    <button class="btn-member" onclick="openMemberModal()">登入 / 加入</button>
  </div>

  <!-- CALORIE BAR -->
  <div id="calorieBar" style="display:none; background:#fff; border-radius:14px; padding:12px 16px; margin-bottom:14px; box-shadow:0 2px 12px rgba(26,10,0,0.08);">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
      <span style="font-size:18px">🔥</span>
      <span style="font-weight:700; font-size:14px; flex:1">今日熱量累計</span>
      <span id="calTotal" style="font-weight:900; font-size:18px; color:var(--red)">0</span>
      <span style="font-size:12px; color:#aaa"> kcal</span>
      <span id="calJudge" style="font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; background:#eee; color:#666; margin-left:4px;"></span>
    </div>
    <div style="background:#f0ece4; border-radius:99px; height:10px; overflow:hidden;">
      <div id="calBar" style="height:100%; border-radius:99px; background:linear-gradient(90deg,var(--green),var(--yellow),var(--red)); transition:width .5s ease; width:0%;"></div>
    </div>
    <div style="display:flex; justify-content:space-between; font-size:10px; color:#bbb; margin-top:4px;">
      <span>0</span><span>建議上限 2000 kcal</span>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('meals',this)">
      <span class="tab-icon">🍱</span>指定套餐
    </button>
    <button class="tab" onclick="switchTab('single',this)">
      <span class="tab-icon">🛒</span>單點商品
    </button>
    <button class="tab" onclick="switchTab('cart',this)">

function runAiRecommend() {
  const budget = parseInt(document.getElementById('aiBudget').value);
  if (!budget || budget < 80) { showToast('請輸入有效預算（至少 $80）', 'error'); return; }

  const resultEl = document.getElementById('aiResult');
  resultEl.innerHTML = `<div style="text-align:center;padding:20px;color:#aaa;font-size:14px">🤖 分析中…</div>`;

  setTimeout(() => {
    const combos = generateCombos(budget, aiPeople, aiPref);
    if (!combos.length) {
      resultEl.innerHTML = `<div style="text-align:center;padding:20px;color:#aaa">😅 預算不足，最低套餐需 $80，試試提高預算！</div>`;
      return;
    }
    resultEl.innerHTML = combos.map((c, i) => `
      <div class="ai-result-card">
        <div class="tag ${i===0?'best':'alt'}">${i===0?'🏆 最推薦':'💡 備選方案'}</div>
        <div class="ai-result-title">${c.title}</div>
        <div class="ai-result-items">${c.lines.join('<br>')}</div>
        <div class="ai-result-meta">
          <span>💰 共 $${c.price}</span>
          <span style="color:${budget-c.price>=0?'#2E7D32':'#B71C1C'}">餘 $${budget - c.price}</span>
          <span>🔥 ${c.kcal} kcal</span>
        </div>
        <button class="ai-add-btn" onclick="addComboToCart(${JSON.stringify(c.items).replace(/"/g,'&quot;')})">＋ 加入購物車</button>
      </div>
    `).join('');
  }, 800);
}

function generateCombos(budget, people, pref) {
  // Score each meal per person
  const scored = MEALS.map(m => {
    let score = 0;
    if (pref === 'filling') score = MEAL_KCAL[m.code];
    else if (pref === 'light') score = -MEAL_KCAL[m.code];
    else if (pref === 'value') score = MEAL_KCAL[m.code] / m.price * 100;
    else score = MEAL_KCAL[m.code] / m.price * 80 - Math.abs(MEAL_KCAL[m.code] - 750) / 10;
    return { ...m, score };
  }).sort((a,b) => b.score - a.score);

  const results = [];

  // Try top combo: same meal for all people
  for (const m of scored) {
    const totalP = m.price * people;
    if (totalP <= budget) {
      results.push({
        title: `${m.name} × ${people}`,
        lines: [`套餐 ${m.code}：${m.items}`, `每份 $${m.price}，共 ${people} 份`],
        price: totalP,
        kcal: MEAL_KCAL[m.code] * people,
        items: [{ type:'meal', code:m.code, qty:people }]
      });
      break;
    }
  }

  // Try mixed combo (2 different meals)
  if (people >= 2) {
    for (let i = 0; i < scored.length; i++) {
      for (let j = i; j < scored.length; j++) {
        const half1 = Math.ceil(people / 2), half2 = Math.floor(people / 2);
        const totalP = scored[i].price * half1 + scored[j].price * half2;
        if (totalP <= budget && !(results[0] && results[0].title.includes(scored[i].name) && results[0].title.includes(scored[j].name))) {
          results.push({
            title: `${scored[i].name} + ${scored[j].name}`,
            lines: [
              `套餐 ${scored[i].code}：${scored[i].items} × ${half1}`,
              `套餐 ${scored[j].code}：${scored[j].items} × ${half2}`
            ],
            price: totalP,
            kcal: MEAL_KCAL[scored[i].code] * half1 + MEAL_KCAL[scored[j].code] * half2,
            items: [
              { type:'meal', code:scored[i].code, qty:half1 },
              { type:'meal', code:scored[j].code, qty:half2 }
            ]
          });
          if (results.length >= 2) break;
        }
      }
      if (results.length >= 2) break;
    }
  }

  return results.slice(0, 2);
}

function addComboToCart(items) {
  for (const item of items) {
    if (item.type === 'meal') {
      const key  = 'meal-' + item.code;
      const meal = MEALS.find(m => m.code === item.code);
      if (!cart[key]) cart[key] = { type:'meal', code:item.code, name:meal.name, price:meal.price, qty:0 };
      cart[key].qty += item.qty;
      document.getElementById('mq-' + item.code).textContent = cart[key].qty;
    }
  }
  reCalcTotal();
  closeModal('aiModal');
  showToast('✅ 推薦套餐已加入購物車！', 'success');
}

// ── MEALS ──
function renderMeals() {
  const g = document.getElementById('mealGrid');
  g.innerHTML = MEALS.map(m => `
    <div class="meal-card" id="mc-${m.code}">
      <div class="meal-img-wrap">
        ${MEAL_SVGS[m.code]}
        <div class="meal-img-badge">${m.code}</div>
        <div class="meal-img-price">$${m.price}</div>
        <div class="cal-badge">🔥 ${MEAL_KCAL[m.code]} kcal</div>
      </div>
      <div class="meal-body">
        <div class="meal-name">${m.name}</div>
        <div class="meal-items">${m.items.split('＋').join(' · ')}</div>
        <div class="meal-qty-row">
          <button class="qty-btn" onclick="changeMealQty('${m.code}',-1)">−</button>
          <div class="qty-num" id="mq-${m.code}">0</div>
          <button class="qty-btn" onclick="changeMealQty('${m.code}',1)">＋</button>
        </div>
      </div>
    </div>
  `).join('');
}

function changeMealQty(code, delta) {
  const key  = 'meal-' + code;
  const meal = MEALS.find(m => m.code === code);
  if (!cart[key]) cart[key] = { type:'meal', code, name:`套餐${code}`, price:meal.price, qty:0 };
  cart[key].qty = Math.max(0, cart[key].qty + delta);
  if (cart[key].qty === 0) delete cart[key];
  const qty = cart[key]?.qty ?? 0;
  document.getElementById('mq-' + code).textContent = qty;
  reCalcTotal();
  if (delta > 0) showToast(`✅ 套餐 ${code} 加入購物車`, 'success');
}

// ── PRODUCTS ──
function renderProducts() {
  const l = document.getElementById('productList');
  l.innerHTML = PRODUCTS.map((p, i) => {
    const isSpecial = i === dsIdx;
    const curPrice  = isSpecial ? dsPrice : p.price;
    const priceHtml = isSpecial
      ? `<span class="product-old">$${p.price}</span><span style="color:var(--red);font-weight:900">$${dsPrice}</span>`
      : `<span class="product-price">$${p.price}</span>`;
    const tag = isSpecial ? '<span class="product-special-tag">特價</span>' : '';
    return `
      <div class="product-row">
        <span class="product-num">${String(i+1).padStart(2,'0')}</span>
        <span class="product-emoji">${p.emoji}</span>
        <span class="product-name">${p.name}${tag}</span>
        <span style="font-size:11px;color:#bbb;margin-right:4px">🔥${PROD_KCAL[i]}</span>
        ${priceHtml}
        <div class="meal-qty-row" style="margin-top:0">
          <button class="qty-btn" onclick="changeProdQty(${i},-1)">−</button>
          <div class="qty-num" id="pq-${i}">0</div>
          <button class="qty-btn" onclick="changeProdQty(${i},1)">＋</button>
        </div>
      </div>`;
  }).join('');
}

function changeProdQty(idx, delta) {
  const key  = 'prod-' + idx;
  const prod = PRODUCTS[idx];
  const isSpecial = idx === dsIdx;
  const curPrice  = isSpecial ? dsPrice : prod.price;
  if (!cart[key]) cart[key] = { type:'prod', idx, name:prod.name, emoji:prod.emoji, price:curPrice, qty:0 };
  cart[key].qty = Math.max(0, cart[key].qty + delta);
  if (cart[key].qty === 0) delete cart[key];
  document.getElementById('pq-' + idx).textContent = cart[key]?.qty ?? 0;
  reCalcTotal();
  if (delta > 0) showToast(`✅ ${prod.name} 加入購物車`, 'success');
}

// ── CART ──
function reCalcTotal() {
  total = Object.values(cart).reduce((s, v) => s + v.price * v.qty, 0);
  const count = Object.values(cart).reduce((s, v) => s + v.qty, 0);
  document.getElementById('barTotal').textContent = total;
  document.getElementById('cartBadge').textContent = count;
  document.getElementById('barItems').textContent = count > 0 ? `共 ${count} 件商品` : '購物車是空的';
  updateCalorieBar();
}

function getTotalKcal() {
  let kcal = 0;
  for (const [key, v] of Object.entries(cart)) {
    if (v.type === 'meal') kcal += (MEAL_KCAL[v.code] || 0) * v.qty;
    else kcal += (PROD_KCAL[v.idx] || 0) * v.qty;
  }
  return kcal;
}

function updateCalorieBar() {
  const bar = document.getElementById('calorieBar');
  const kcal = getTotalKcal();
  if (kcal === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  document.getElementById('calTotal').textContent = kcal;
  const pct = Math.min(100, Math.round(kcal / 2000 * 100));
  document.getElementById('calBar').style.width = pct + '%';
  const judge = document.getElementById('calJudge');
  if (kcal < 600)       { judge.textContent = '🥗 清淡';  judge.style.background='#E8F5E9'; judge.style.color='#2E7D32'; }
  else if (kcal < 1000) { judge.textContent = '✅ 適量';  judge.style.background='#E3F2FD'; judge.style.color='#1565C0'; }
  else if (kcal < 1500) { judge.textContent = '⚠️ 偏高'; judge.style.background='#FFF8E1'; judge.style.color='#E65100'; }
  else                   { judge.textContent = '🔥 超標！'; judge.style.background='#FFEBEE'; judge.style.color='#B71C1C'; }
}

function renderCart() {
  const el = document.getElementById('cartContent');
  const items = Object.entries(cart);
  if (!items.length) {
    el.innerHTML = `<div class="cart-empty"><span class="big-emoji">🛒</span>購物車是空的，快去選些好料！</div>`;
    return;
  }

  let discountInfo = '';
  let displayTotal = total;

  // Tier discount preview
  if (total >= 1000) {
    displayTotal = Math.ceil(total * 0.85);
    discountInfo = '🎊 消費破千，享 85 折！';
  } else if (total >= 500) {
    displayTotal = Math.ceil(total * 0.9);
    discountInfo = '🎉 消費破五百，享 9 折！';
  } else if (total >= 400) {
    discountInfo = `💡 再加 $${500 - total} 元即可享 9 折折扣！`;
  }

  const memberDiscount = isMember ? Math.ceil(displayTotal * 0.95) : displayTotal;

  el.innerHTML = `
    ${items.map(([key, v]) => `
      <div class="cart-item">
        <span style="font-size:22px">${v.emoji || '🍱'}</span>
        <div style="flex:1">
          <div class="cart-item-name">${v.name}</div>
          <div class="cart-item-qty">x${v.qty}  × $${v.price}</div>
        </div>
        <div class="cart-item-price">$${v.price * v.qty}</div>
        <button class="cart-remove" onclick="removeCart('${key}')">🗑</button>
      </div>
    `).join('')}
    <div class="cart-summary">
      <div class="row"><span>小計</span><span>$${total}</span></div>
      ${discountInfo ? `<div class="row" style="color:var(--yellow)"><span>${discountInfo}</span><span>$${displayTotal}</span></div>` : ''}
      ${isMember ? `<div class="row"><span>👤 會員九五折</span><span>$${memberDiscount}</span></div>` : ''}
      <hr style="border-color:rgba(255,255,255,0.15);margin:12px 0">
      <div class="row"><span>預估總計</span><span class="total">$${isMember ? memberDiscount : displayTotal}</span></div>
      ${isMember ? '' : '<div class="discount-note">登入會員可再享九五折</div>'}
    </div>
    <button class="btn-primary" style="margin-top:16px" onclick="switchTab(\'checkout\',null)">前往結帳 →</button>
  `;
}

function removeCart(key) {
  if (!cart[key]) return;
  const name = cart[key].name;
  // update qty display
  if (cart[key].type === 'meal') {
    document.getElementById('mq-' + cart[key].code).textContent = 0;
  } else {
    document.getElementById('pq-' + cart[key].idx).textContent = 0;
  }
  delete cart[key];
  reCalcTotal();
  renderCart();
  showToast(`🗑 已移除 ${name}`, 'info');
}

// ── CHECKOUT ──
function renderCheckout() {
  const el = document.getElementById('checkoutContent');
  if (!Object.keys(cart).length) {
    el.innerHTML = `<div class="cart-empty"><span class="big-emoji">💳</span>購物車是空的，請先加入商品！</div>`;
    return;
  }
  el.innerHTML = `
    <div class="checkout-section">
      <h3>訂單摘要</h3>
      ${Object.values(cart).map(v => `
        <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px">
          <span>${v.emoji||'🍱'} ${v.name} x${v.qty}</span>
          <span style="font-weight:700">$${v.price*v.qty}</span>
        </div>`).join('')}
      <hr style="border:none;border-top:2px dashed #eee;margin:12px 0">
      <div style="display:flex;justify-content:space-between;font-weight:900;font-size:16px">
        <span>合計</span><span style="color:var(--red)">$${total}</span>
      </div>
    </div>
    <div class="checkout-section">
      <h3>💳 付款方式</h3>
      <div class="pay-options">
        <div class="pay-opt ${selectedPay==='card'?'selected':''}" onclick="selPay('card',this)">
          <span class="pay-icon">💳</span>信用卡
        </div>
        <div class="pay-opt ${selectedPay==='line'?'selected':''}" onclick="selPay('line',this)">
          <span class="pay-icon">📱</span>LINE Pay
        </div>
        <div class="pay-opt ${selectedPay==='cash'?'selected':''}" onclick="selPay('cash',this)">
          <span class="pay-icon">💵</span>現金
        </div>
      </div>
    </div>
    ${isMember ? `<div class="checkout-section" style="background:#fffbf0;border:2px solid var(--yellow)">
      <h3>👤 會員優惠</h3>
      <p style="font-size:14px">九五折折扣 → <strong style="color:var(--red)">$${Math.ceil(total*0.95)}</strong>（省 $${total - Math.ceil(total*0.95)} 元）</p>
      <p style="font-size:13px;color:#888;margin-top:6px">本次可獲得 <strong>${Math.floor(Math.ceil(total*0.95)/10)}</strong> 積分</p>
    </div>` : `<div class="checkout-section" style="background:#fff5f5;border:2px dashed var(--red)">
      <p style="font-size:14px">🔑 <strong>登入會員</strong> 即享九五折 + 積分回饋！</p>
    </div>`}
    <button class="btn-primary" onclick="doCheckout()" ${selectedPay?'':'disabled'}>
      ${selectedPay ? '確認結帳 🎉' : '請先選擇付款方式'}
    </button>
  `;
}

function selPay(type, el) {
  selectedPay = type;
  document.querySelectorAll('.pay-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  renderCheckout();
}

async function doCheckout() {
  if (!Object.keys(cart).length) { showToast('購物車是空的！', 'error'); return; }
  // Lucky wheel
  await runLuckyWheel();
}

async function runLuckyWheel() {
  openModal('wheelModal');
  const emojis = ['🎰','🍀','🎲','🎡','💫','🌟'];
  const el = document.getElementById('wheelEmoji');
  let i = 0;
  await new Promise(r => {
    const timer = setInterval(() => {
      el.textContent = emojis[i++ % emojis.length];
    }, 160);
    setTimeout(() => { clearInterval(timer); r(); }, 2200);
  });

  const prize = PRIZES[Math.floor(Math.random() * PRIZES.length)];
  el.textContent = prize.label.split(' ')[0];

  let finalTotal = total;

  // Tier discount
  if (finalTotal >= 1000)     finalTotal = Math.ceil(finalTotal * 0.85);
  else if (finalTotal >= 500) finalTotal = Math.ceil(finalTotal * 0.9);

  // Prize discount
  if (prize.discount) {
    finalTotal = Math.max(0, finalTotal - prize.discount);
  }

  // Member discount
  let ptsEarned = 0;
  if (isMember) {
    finalTotal = Math.ceil(finalTotal * 0.95);
    ptsEarned  = Math.floor(finalTotal / 10);
    memberPoints[memberName] = (memberPoints[memberName] || 0) + ptsEarned;
    updateMemberUI();
  }

  document.getElementById('wheelResult').innerHTML =
    `🎁 恭喜獲得：<strong>${prize.label}</strong>${prize.discount ? `<br>已折抵 $${prize.discount}！` : ''}`;

  await new Promise(r => setTimeout(r, 2200));
  closeModal('wheelModal');
  showReceipt(finalTotal, prize, ptsEarned);
}

function showReceipt(finalTotal, prize, ptsEarned) {
  const now  = new Date();
  const dateStr = now.toLocaleDateString('zh-TW') + ' ' + now.toLocaleTimeString('zh-TW');
  const payLabel = { card:'信用卡', line:'LINE Pay', cash:'現金' }[selectedPay];

  const rows = Object.values(cart).map(v =>
    `<div class="receipt-row"><span>${v.name} x${v.qty}</span><span>$${v.price*v.qty}</span></div>`
  ).join('');

  let discountRow = '';
  if (total >= 1000)     discountRow = `<div class="receipt-row"><span>🎊 破千八五折</span><span>-$${total - Math.ceil(total*0.85)}</span></div>`;
  else if (total >= 500) discountRow = `<div class="receipt-row"><span>🎉 破五百九折</span><span>-$${total - Math.ceil(total*0.9)}</span></div>`;
  if (prize.discount)    discountRow += `<div class="receipt-row"><span>🎁 幸運轉盤折抵</span><span>-$${prize.discount}</span></div>`;
  if (isMember)          discountRow += `<div class="receipt-row"><span>👤 會員九五折</span><span>折後 $${finalTotal}</span></div>`;

  document.getElementById('receiptContent').innerHTML = `
    <div class="receipt">
      <div class="receipt-header">
        <div class="receipt-logo">賣噹噹</div>
        <div class="receipt-date">${dateStr}</div>
        ${isMember ? `<div style="margin-top:6px"><span class="pts-pill">⭐ ${memberName}</span></div>` : ''}
      </div>
      <hr class="receipt-divider">
      ${rows}
      ${discountRow ? `<hr class="receipt-divider">${discountRow}` : ''}
      <hr class="receipt-divider">
      <div class="receipt-total-row"><span>合計</span><span style="color:var(--red)">$${finalTotal}</span></div>
      <div class="receipt-row" style="margin-top:8px"><span>付款方式</span><span>${payLabel}</span></div>
      <div class="receipt-row" style="color:#E65100"><span>🔥 總熱量</span><span>${getTotalKcal()} kcal</span></div>
      ${ptsEarned ? `<div class="receipt-row" style="color:var(--orange)"><span>⭐ 獲得積分</span><span>+${ptsEarned} 點（累計 ${memberPoints[memberName]} 點）</span></div>` : ''}
      <div class="receipt-thanks">
        🙏 感謝光臨賣噹噹<br>歡迎下次再來！
      </div>
    </div>
  `;
  openModal('receiptModal');
}

function newOrder() {
  closeModal('receiptModal');
  cart = {};
  total = 0;
  selectedPay = '';
  // reset qty displays
  MEALS.forEach(m => { const el = document.getElementById('mq-' + m.code); if(el) el.textContent=0; });
  PRODUCTS.forEach((_, i) => { const el = document.getElementById('pq-' + i); if(el) el.textContent=0; });
  reCalcTotal();
  document.getElementById('calorieBar').style.display = 'none';
  switchTab('meals', document.querySelectorAll('.tab')[0]);
  showToast('🆕 新訂單開始！', 'success');
}

// ── MEMBER SYSTEM ──
function openMemberModal() {
  if (isMember) {
    // Show member info
    document.getElementById('memberModalTitle').textContent = `👤 ${memberName}`;
    document.getElementById('memberModalBody').innerHTML = `
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:60px">😊</div>
        <p style="font-size:16px;margin:12px 0">歡迎回來，<strong>${memberName}</strong>！</p>
        <div class="pts-pill" style="margin:8px auto;display:inline-flex">
          ⭐ 累計積分：${memberPoints[memberName] || 0} 點
        </div>
      </div>
      <button class="btn-secondary" onclick="logout()" style="width:100%;margin-top:8px">登出</button>
    `;
  } else {
    showLoginForm();
  }
  openModal('memberModal');
}

function showLoginForm() {
  document.getElementById('memberModalTitle').textContent = '🔐 會員登入';
  document.getElementById('memberModalBody').innerHTML = `
    <div class="form-group">
      <label>帳號</label>
      <input class="form-input" id="loginAcc" placeholder="輸入帳號" />
    </div>
    <div class="form-group">
      <label>密碼</label>
      <input class="form-input" id="loginPw" type="password" placeholder="輸入密碼" />
    </div>
    <button class="btn-primary" onclick="doLogin()">登入</button>
    <div style="text-align:center;margin-top:14px">
      <span style="font-size:14px;color:#888">還沒有帳號？</span>
      <button class="btn-secondary" onclick="showRegisterForm()" style="margin-left:6px">加入會員</button>
    </div>
  `;
}

function showRegisterForm() {
  document.getElementById('memberModalTitle').textContent = '🎉 加入會員';
  document.getElementById('memberModalBody').innerHTML = `
    <div class="form-group">
      <label>帳號</label>
      <input class="form-input" id="regAcc" placeholder="設定帳號" />
    </div>
    <div class="form-group">
      <label>密碼</label>
      <input class="form-input" id="regPw" type="password" placeholder="設定密碼" />
    </div>
    <div class="form-group">
      <label>確認密碼</label>
      <input class="form-input" id="regPw2" type="password" placeholder="再次輸入密碼" />
    </div>
    <button class="btn-primary" onclick="doRegister()">立即加入</button>
    <div style="text-align:center;margin-top:14px">
      <button class="btn-secondary" onclick="showLoginForm()">← 返回登入</button>
    </div>
  `;
}

function doLogin() {
  const acc = document.getElementById('loginAcc')?.value.trim();
  const pw  = document.getElementById('loginPw')?.value;
  if (!acc || !pw) { showToast('請輸入帳號和密碼', 'error'); return; }
  if (!allMembers[acc]) { showToast('查無此帳號', 'error'); return; }
  if (allMembers[acc] !== pw) { showToast('密碼錯誤', 'error'); return; }
  isMember   = true;
  memberName = acc;
  updateMemberUI();
  closeModal('memberModal');
  showToast(`✅ 歡迎回來，${acc}！`, 'success');
}

function doRegister() {
  const acc = document.getElementById('regAcc')?.value.trim();
  const pw  = document.getElementById('regPw')?.value;
  const pw2 = document.getElementById('regPw2')?.value;
  if (!acc) { showToast('請輸入帳號', 'error'); return; }
  if (allMembers[acc]) { showToast('此帳號已存在', 'error'); return; }
  if (pw !== pw2) { showToast('兩次密碼不一致', 'error'); return; }
  if (pw.length < 1) { showToast('請設定密碼', 'error'); return; }
  allMembers[acc]   = pw;
  memberPoints[acc] = 0;
  isMember   = true;
  memberName = acc;
  updateMemberUI();
  closeModal('memberModal');
  showToast(`🎉 ${acc} 成功加入會員！`, 'success');
}

function logout() {
  isMember   = false;
  memberName = '';
  updateMemberUI();
  closeModal('memberModal');
  showToast('👋 已登出', 'info');
}

function updateMemberUI() {
  if (isMember) {
    document.getElementById('memberAvatar').textContent = memberName[0] || '👤';
    document.getElementById('memberName').textContent   = memberName;
    document.getElementById('memberPts').textContent    = `⭐ ${memberPoints[memberName] || 0} 積分`;
  } else {
    document.getElementById('memberAvatar').textContent = '👤';
    document.getElementById('memberName').textContent   = '訪客';
    document.getElementById('memberPts').textContent    = '登入享九五折 + 積分回饋';
  }
}

// ── MODAL UTILS ──
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
// Click outside to close
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); });
});

// ── TOAST ──
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  container.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
</script>
